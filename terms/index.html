ersonal experience. Any decisions about investments or actions are your own responsibility.", "priv": "Privacy Policy", "terms": "Terms of Service"}}};

    for(i=0;i<bs.length;i++){ b=bs[i];
      if(b.getAttribute&&b.getAttribute('aria-pressed')==='true'&&b.offsetWidth>0&&(b.classList.contains('au-rng')||b.classList.contains('lang-btn'))) return b;
    }
    return null;
  }
  function geom(row,el){
    var rr=row.getBoundingClientRect(), er=el.getBoundingClientRect();
    return {x:er.left-rr.left-row.clientLeft, y:er.top-rr.top-row.clientTop, w:er.width, h:er.height};
  }
  function css(g){ return {translate:g.x+'px '+g.y+'px', width:g.w+'px', height:g.h+'px'}; }
  function stop(s){ if(s.anims){ s.anims.forEach(function(a){ a.cancel(); }); s.anims=null; } }
  function running(s){ return !!(s.anims&&s.anims[0]&&s.anims[0].playState==='running'); }

  function sync(row){
    var s=row._gb||(row._gb={el:null,last:null,anims:null}), bub=s.el, btn, g, from, f;

    g=geom(row,btn);
    if(s.last&&s.last.b===btn&&Math.abs(s.last.x-g.x)<.25&&Math.abs(s.last.y-g.y)<.25&&Math.abs(s.last.w-g.w)<.25&&Math.abs(s.last.h-g.h)<.25) return;

      stop(s);
      /* pozīcija un izmērs: pārslīd ar atsperes līkni; mēroga "uzpūtums" 1 -> 1,12 -> 1 atsevišķi pa visu kustības ilgumu */
      s.anims=[bub.animate([css(from),css(g)],{duration:DUR,easing:EASE}),

      s.anims[0].onfinish=s.anims[0].oncancel=function(){ s.anims=null; };
    } else stop(s);

  new MutationObserver(function(recs){
    var i, r, j, own;
    for(i=0;i<recs.length;i++){ r=recs[i];
      if(r.target.classList&&r.target.classList.contains('glass-bubble')) continue;
      if(r.type==='childList'){ own=true; for(j=0;j<r.addedNodes.length;j++) if(!(r.addedNodes[j].classList&&r.addedNodes[j].classList.contains('glass-bubble'))) own=false;

  window.addEventListener('pageshow',schedule); window.addEventListener('load',schedule);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);
  schedule();
})();
</script>
<script>
/* Logo atspīdums: vienreiz uz katru iedarbināšanu. Pele (pointerenter, mouse/pen) -> uzreiz; pieskāriens (touch) -> pie pirksta pacelšanas (pointerup),
   tāpēc lapas ritināšana pār logo (browser pārņem žestu -> pointercancel) efektu neiedarbina un netiek traucēta (nav preventDefault, pasīvi klausītāji). Kamēr efekts notiek, jauns nesākas;
   pats no sevis neatkārtojas. Pašu animāciju veido CSS (.logo-shining uz .logo-glow). */
(function(){
  var box=document.querySelector('.logo-glow'), fx=box&&box.querySelector('.logo-shine'); if(!fx) return;
  var busy=false, timer=0;
  try{ var m=(getComputedStyle(fx).maskImage||getComputedStyle(fx).webkitMaskImage||'').match(/url\("?([^")]+)"?\)/); if(m){ var w=new Image(); w.src=m[1]; } }catch(e){}   /* maska ielādēta jau iepriekš (parasti tas pats fails, ko izmanto logo attēls) */
  function end(){ busy=false; clearTimeout(timer); box.classList.remove('logo-shining'); }
  function go(){ if(busy) return; busy=true; box.classList.add('logo-shining'); timer=setTimeout(end,1200); }
  fx.addEventListener('animationend',function(e){ if(e.animationName==='logoShine') end(); });
  box.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse'||e.pointerType==='pen') go(); },{passive:true});
  box.addEventListener('pointerup',function(e){ if(e.pointerType==='touch') go(); },{passive:true});
})();
</script>
