  var body = document.getElementById('policyBody');

  function apply(lang, persist){
    if (persist !== false){ try{ localStorage.setItem('mrc_lang', lang); }catch(e){} }
    document.documentElement.setAttribute('lang', lang);
    document.getElementById('plv').setAttribute('aria-pressed', lang === 'lv' ? 'true' : 'false');
    document.getElementById('pen').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    body.innerHTML = DATA.body[lang];
    document.title = DATA.title[lang];
    var f = DATA.ft[lang];
    document.getElementById('ftText').innerHTML = f.footer;
    document.getElementById('ftPriv').textContent = f.priv;
    document.getElementById('ftTerms').textContent = f.terms;
  }
  document.getElementById('plv').addEventListener('click', function(){ apply('lv', true); });
  document.getElementById('pen').addEventListener('click', function(){ apply('en', true); });

  /* Valodas noteikšana: 1) ?lang=en|lv  2) localStorage['mrc_lang'] (kopīgs ar sākumlapu)  3) noklusējums LV */
  function urlLang(){
    try{ var m = /[?&]lang=(en|lv)\b/i.exec(window.location.search); if (m) return m[1].toLowerCase(); }catch(e){}
    return null;
  }
  var initial = urlLang();
  if (!initial){ try{ initial = localStorage.getItem('mrc_lang'); }catch(e){} }
  if (initial !== 'lv' && initial !== 'en') initial = 'lv';
  apply(initial, false);

  /* Iframe modālis: "Atgriezties" aizver logu (postMessage uz sākumlapu) */
  var isModal = window.self !== window.top;
  if (isModal){ document.body.classList.add('in-modal'); document.documentElement.classList.add('in-modal'); }
  document.addEventListener('click', function(e){
    var back = e.target.closest('.back'); if (!back) return;
    if (isModal){ e.preventDefault(); try{ window.parent.postMessage('mrc-close-policy', '*'); }catch(err){} }
    else { e.preventDefault(); window.location.href = '../'; }
  });
})();
</script>
<script>
/* Slīdošs stikla burbulis pogu rindās (.au-rngs: 1D/1W/1M un BTC/ETH/SOL/XRP tirgus pārskatā, analīzē un ETF blokā; .lang-switcher: LV/EN).
   Katrā rindā viens <span.glass-bubble>, kas stāv zem izvēlētās pogas (aria-pressed="true"). Mainoties izvēlei, tas pārslīd uz jauno pogu
   0,35 s ar cubic-bezier(.34,1.4,.5,1), kustībā palielinās līdz 1,12. Citos gadījumos (bloka atvēršana, valodas maiņa, pagriešana, izmēra / fonta
   izmaiņas, rindas parādīšanās) burbulis tiek uzreiz novietots pareizi bez animācijas. Pogu klikšķu loģika un GA netiek aiztikti. */
(function(){
  var SEL='.lang-switcher', EASE='cubic-bezier(.34,1.4,.5,1)', DUR=350, SCALE=1.12;
  var mqReduce=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
  var ro=window.ResizeObserver?new ResizeObserver(schedule):null, queued=false;

  function pressed(row){
    var bs=row.children, i, b;
    for(i=0;i<bs.length;i++){ b=bs[i];
      if(b.getAttribute&&b.getAttribute('aria-pressed')==='true'&&b.offsetWidth>0&&(b.classList.contains('au-rng')||b.classList.contains('lang-btn'))) return b;
    }
    return null;
  }
  function geom(row,el){
    var rr=row.getBoundingClientRect(), er=el.getBoundingClientRect();
    return {x:er.left-rr.left-row.clientLeft, y:er.top-rr.top-row.clientTop, w:er.width, h:er.height};
  }
  function css(g){ return {translate:g.x+'px '+g.y+'px', width:g.w+'px', height:g.h+'px'}; }
  function stop(s){ if(s.anims){ s.anims.forEach(function(a){ a.cancel(); }); s.anims=null; } }
  function running(s){ return !!(s.anims&&s.anims[0]&&s.anims[0].playState==='running'); }

  function sync(row){
    var s=row._gb||(row._gb={el:null,last:null,anims:null}), bub=s.el, btn, g, from, f;
    if(!bub||bub.parentNode!==row){
      bub=s.el=document.createElement('span'); bub.className='glass-bubble'; bub.setAttribute('aria-hidden','true');
      row.appendChild(bub); s.last=null;
      if(ro){ ro.observe(row); }
    }
    if(ro){ var kids=row.children, k; for(k=0;k<kids.length;k++) if(kids[k]!==bub) ro.observe(kids[k]); }
    btn=row.offsetWidth>0?pressed(row):null;
    if(!btn){ stop(s); bub.classList.remove('on'); s.last=null; return; }
    g=geom(row,btn);
    if(s.last&&s.last.b===btn&&Math.abs(s.last.x-g.x)<.25&&Math.abs(s.last.y-g.y)<.25&&Math.abs(s.last.w-g.w)<.25&&Math.abs(s.last.h-g.h)<.25) return;
    if(s.last&&s.last.b!==btn&&bub.classList.contains('on')&&bub.animate&&!(mqReduce&&mqReduce.matches)){
      if(running(s)){ from=geom(row,bub); f=parseFloat(getComputedStyle(bub).scale)||1; from.x+=from.w*(1-1/f)/2; from.y+=from.h*(1-1/f)/2; from.w/=f; from.h/=f; }
      else from={x:s.last.x,y:s.last.y,w:s.last.w,h:s.last.h};
      stop(s);
      /* pozīcija un izmērs: pārslīd ar atsperes līkni; mēroga "uzpūtums" 1 -> 1,12 -> 1 atsevišķi pa visu kustības ilgumu */
      s.anims=[bub.animate([css(from),css(g)],{duration:DUR,easing:EASE}),
               bub.animate([{scale:'1',easing:'ease-out'},{scale:String(SCALE),offset:.5,easing:'ease-in'},{scale:'1'}],{duration:DUR,easing:'linear'})];
      s.anims[0].onfinish=s.anims[0].oncancel=function(){ s.anims=null; };
    } else stop(s);
    bub.style.translate=g.x+'px '+g.y+'px'; bub.style.width=g.w+'px'; bub.style.height=g.h+'px';
    bub.classList.add('on');
    s.last={b:btn,x:g.x,y:g.y,w:g.w,h:g.h};
  }
  function syncAll(){ queued=false; var rows=document.querySelectorAll(SEL), i; for(i=0;i<rows.length;i++) sync(rows[i]); }
  function schedule(){ if(queued) return; queued=true; (window.requestAnimationFrame||setTimeout)(syncAll); }

  new MutationObserver(function(recs){
    var i, r, j, own;
    for(i=0;i<recs.length;i++){ r=recs[i];
      if(r.target.classList&&r.target.classList.contains('glass-bubble')) continue;
      if(r.type==='childList'){ own=true; for(j=0;j<r.addedNodes.length;j++) if(!(r.addedNodes[j].classList&&r.addedNodes[j].classList.contains('glass-bubble'))) own=false;
        if(own&&r.removedNodes.length===0) continue; }
      schedule(); return;
    }
  }).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-pressed','style','hidden','class','open','lang']});
  window.addEventListener('resize',schedule); window.addEventListener('orientationchange',function(){ schedule(); setTimeout(schedule,250); });
  window.addEventListener('pageshow',schedule); window.addEventListener('load',schedule);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(schedule);
  schedule();
})();
</script>
<script>
/* Logo atspīdums: vienreiz uz katru iedarbināšanu. Pele (pointerenter, mouse/pen) -> uzreiz; pieskāriens (touch) -> pie pirksta pacelšanas (pointerup),
   tāpēc lapas ritināšana pār logo (browser pārņem žestu -> pointercancel) efektu neiedarbina un netiek traucēta (nav preventDefault, pasīvi klausītāji). Kamēr efekts notiek, jauns nesākas;
   pats no sevis neatkārtojas. Pašu animāciju veido CSS (.logo-shining uz .logo-glow). */
(function(){
  var box=document.querySelector('.logo-glow'), fx=box&&box.querySelector('.logo-shine'); if(!fx) return;
  var busy=false, timer=0;
  try{ var m=(getComputedStyle(fx).maskImage||getComputedStyle(fx).webkitMaskImage||'').match(/url\("?([^")]+)"?\)/); if(m){ var w=new Image(); w.src=m[1]; } }catch(e){}   /* maska ielādēta jau iepriekš (parasti tas pats fails, ko izmanto logo attēls) */
  function end(){ busy=false; clearTimeout(timer); box.classList.remove('logo-shining'); }
  function go(){ if(busy) return; busy=true; box.classList.add('logo-shining'); timer=setTimeout(end,1200); }
  fx.addEventListener('animationend',function(e){ if(e.animationName==='logoShine') end(); });
  box.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse'||e.pointerType==='pen') go(); },{passive:true});
  box.addEventListener('pointerup',function(e){ if(e.pointerType==='touch') go(); },{passive:true});
})();
</script>
