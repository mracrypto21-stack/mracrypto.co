name: Update latest videos

# Katru dienu plkst. 17:50 pēc Latvijas laika (Europe/Riga).
# GitHub cron strādā tikai UTC, tāpēc ir divi palaišanas brīži (vasaras un ziemas laiks),
# un solis "Check Riga time" izlaiž to, kas neatbilst 17:50 Rīgā.
on:
  schedule:
    - cron: "50 14 * * *"   # = 17:50 vasaras laikā (EEST, UTC+3)
    - cron: "50 15 * * *"   # = 17:50 ziemas laikā (EET, UTC+2)
  workflow_dispatch:
    inputs:
      force:
        description: "Palaist neatkarīgi no laika (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Riga time
        id: gate
        run: |
          now=$(TZ=Europe/Riga date +%H%M)
          echo "Riga time now: $now"
          # GitHub schedule var kavēties; derīgs logs 17:40-18:40 Rīgā
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$now" -ge 1740 ] && [ "$now" -lt 1840 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Fetch latest videos (YouTube RSS)
        if: steps.gate.outputs.run == 'true'
        run: python3 .github/scripts/update_videos.py

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- assets/latest-videos.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-videos.json
          git commit -m "chore: update latest videos"
          git pull --rebase origin main
          git push origin HEAD:main
